<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RAM 3500 6.7L Cummins · Diesel Simulator</title>
    <style>
        /* ─── RESET & GLOBAL ─── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: #0a0a0f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            color: #e8e8e8;
            padding: 16px;
            margin: 0;
        }

        /* ─── DASHBOARD WRAPPER ─── */
        .dashboard {
            background: linear-gradient(145deg, #14141e, #1c1c2a);
            border-radius: 48px 48px 32px 32px;
            padding: 30px 40px 40px 40px;
            max-width: 960px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9), inset 0 1px 2px rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.03);
            position: relative;
            overflow: hidden;
        }

        .dashboard::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 30% 20%, rgba(200, 120, 50, 0.03), transparent 70%);
            pointer-events: none;
        }

        /* ─── HEADER ─── */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 20px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .header-left .badge {
            background: #c0392b;
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.06em;
            padding: 3px 10px;
            border-radius: 20px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #c0392b, #a93226);
            box-shadow: 0 2px 12px rgba(192, 57, 43, 0.3);
        }

        .header-left h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.02em;
            background: linear-gradient(135deg, #f5f5f5, #a0a0b0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-left .sub {
            font-size: 11px;
            color: #8888a0;
            letter-spacing: 0.04em;
            font-weight: 300;
            margin-left: 4px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .header-right .engine-status {
            font-size: 11px;
            color: #6a8a6a;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header-right .engine-status .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4caf50;
            box-shadow: 0 0 12px rgba(76, 175, 80, 0.4);
            animation: pulse-dot 2s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 0.6;
                transform: scale(0.9);
            }
            50% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        .header-right .mute-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #b0b0c0;
            padding: 6px 14px;
            border-radius: 24px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.25s;
            font-weight: 500;
            letter-spacing: 0.03em;
        }

        .header-right .mute-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }

        .header-right .mute-btn.muted {
            color: #c0392b;
            border-color: rgba(192, 57, 43, 0.3);
        }

        /* ─── MAIN GRID ─── */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 200px;
            gap: 24px;
            align-items: stretch;
        }

        /* ─── LEFT PANEL (gauges) ─── */
        .left-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* ─── RPM GAUGE ─── */
        .gauge-container {
            background: radial-gradient(ellipse at 50% 60%, #1a1a28, #0d0d16);
            border-radius: 28px;
            padding: 16px 20px 18px 20px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: inset 0 4px 20px rgba(0, 0, 0, 0.6);
            position: relative;
            overflow: hidden;
        }

        .gauge-container .gauge-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: #8888a0;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 6px;
        }

        .gauge-container .gauge-label .rpm-val {
            font-size: 18px;
            font-weight: 700;
            color: #e8e8f0;
            letter-spacing: 0.02em;
            font-variant-numeric: tabular-nums;
        }

        .gauge-container .gauge-label .rpm-val .unit {
            font-size: 12px;
            font-weight: 300;
            color: #666680;
            margin-left: 3px;
        }

        .gauge-track {
            position: relative;
            height: 10px;
            background: linear-gradient(90deg, #1a2a1a, #2a3a2a 40%, #3a4a2a 60%, #5a4a2a 80%, #6a3a2a 95%, #7a2a2a);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.6);
        }

        .gauge-track .gauge-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #4caf50, #8bc34a 30%, #ffeb3b 55%, #ff9800 75%, #f44336);
            border-radius: 20px;
            transition: width 0.08s linear;
            box-shadow: 0 0 20px rgba(255, 200, 50, 0.15);
        }

        .gauge-track .tick-marks {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            justify-content: space-between;
            padding: 0 4px;
        }

        .gauge-track .tick-marks span {
            display: block;
            width: 1px;
            height: 100%;
            background: rgba(255, 255, 255, 0.08);
        }

        .gauge-track .tick-marks span:nth-child(5n+1) {
            background: rgba(255, 255, 255, 0.18);
            width: 2px;
        }

        .gauge-markers {
            display: flex;
            justify-content: space-between;
            font-size: 9px;
            color: #555570;
            padding: 2px 4px 0 4px;
            letter-spacing: 0.02em;
        }

        /* ─── SPEED & GEAR ROW ─── */
        .info-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
        }

        .info-card {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 16px;
            padding: 12px 14px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            text-align: center;
        }

        .info-card .label {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #666680;
            margin-bottom: 2px;
        }

        .info-card .value {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 0.02em;
            color: #e8e8f0;
            font-variant-numeric: tabular-nums;
        }

        .info-card .value .sub {
            font-size: 13px;
            font-weight: 400;
            color: #666680;
            margin-left: 2px;
        }

        .info-card.gear .value {
            font-size: 36px;
            color: #f5c842;
            text-shadow: 0 0 30px rgba(245, 200, 66, 0.1);
        }

        .info-card.gear .value .sub {
            font-size: 16px;
            color: #8888a0;
        }

        .info-card.throttle .value {
            color: #6ab0e6;
        }

        /* ─── THROTTLE / PEDAL ─── */
        .pedal-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: stretch;
            background: radial-gradient(ellipse at 50% 30%, #181824, #0e0e18);
            border-radius: 28px;
            padding: 16px 12px 18px 12px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: inset 0 4px 20px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .pedal-area .pedal-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: #666680;
            margin-bottom: 10px;
        }

        .pedal-track {
            position: relative;
            width: 48px;
            flex: 1;
            min-height: 200px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            cursor: pointer;
            touch-action: none;
            box-shadow: inset 0 4px 20px rgba(0, 0, 0, 0.4);
            overflow: visible;
        }

        .pedal-track .pedal-fill {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 0%;
            background: linear-gradient(0deg, #e74c3c, #f39c12, #f1c40f);
            border-radius: 40px;
            transition: height 0.05s linear;
            box-shadow: 0 0 30px rgba(231, 76, 60, 0.15);
        }

        .pedal-track .pedal-thumb {
            position: absolute;
            left: 50%;
            transform: translate(-50%, 50%);
            width: 52px;
            height: 52px;
            background: radial-gradient(ellipse at 40% 35%, #3a3a4a, #1a1a2a);
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.8), inset 0 2px 4px rgba(255, 255, 255, 0.05);
            transition: bottom 0.05s linear;
            cursor: grab;
            touch-action: none;
            pointer-events: none;
        }

        .pedal-track .pedal-thumb::after {
            content: '';
            position: absolute;
            top: 10%;
            left: 20%;
            width: 30%;
            height: 20%;
            background: radial-gradient(ellipse, rgba(255, 255, 255, 0.08), transparent);
            border-radius: 50%;
        }

        .pedal-track .pedal-thumb .pedal-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 18px;
            opacity: 0.4;
        }

        .pedal-track .pedal-thumb.active {
            border-color: rgba(241, 196, 15, 0.5);
            box-shadow: 0 4px 40px rgba(241, 196, 15, 0.2), inset 0 2px 4px rgba(255, 255, 255, 0.05);
        }

        .pedal-percent {
            font-size: 13px;
            font-weight: 600;
            color: #b0b0c0;
            margin-top: 10px;
            letter-spacing: 0.04em;
            font-variant-numeric: tabular-nums;
        }

        .pedal-percent .pct {
            font-size: 20px;
            font-weight: 700;
            color: #e8e8f0;
        }

        /* ─── SHIFT INDICATOR ─── */
        .shift-indicator {
            display: flex;
            justify-content: center;
            gap: 4px;
            margin-top: 8px;
        }

        .shift-indicator .gear-dot {
            width: 18px;
            height: 4px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.06);
            transition: all 0.3s ease;
        }

        .shift-indicator .gear-dot.active {
            background: #f5c842;
            box-shadow: 0 0 16px rgba(245, 200, 66, 0.25);
            width: 28px;
        }

        /* ─── RESPONSIVE ─── */
        @media (max-width: 680px) {
            .dashboard {
                padding: 18px 16px 24px 16px;
                border-radius: 32px;
            }

            .main-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .left-panel {
                order: 1;
            }

            .pedal-area {
                order: 0;
                flex-direction: row;
                padding: 12px 16px;
                gap: 16px;
                align-items: center;
                min-height: 120px;
            }

            .pedal-area .pedal-label {
                margin-bottom: 0;
                writing-mode: vertical-lr;
                letter-spacing: 0.08em;
                font-size: 9px;
            }

            .pedal-track {
                min-height: 100px;
                height: 100px;
                width: 32px;
                flex: 0 0 32px;
            }

            .pedal-track .pedal-thumb {
                width: 40px;
                height: 40px;
            }

            .pedal-track .pedal-thumb .pedal-icon {
                font-size: 14px;
            }

            .pedal-percent {
                margin-top: 0;
                font-size: 11px;
            }

            .pedal-percent .pct {
                font-size: 16px;
            }

            .info-row {
                grid-template-columns: 1fr 1fr 1fr;
                gap: 8px;
            }

            .info-card .value {
                font-size: 20px;
            }

            .info-card.gear .value {
                font-size: 28px;
            }

            .header-left h1 {
                font-size: 16px;
            }

            .header-left .sub {
                font-size: 9px;
            }

            .gauge-container .gauge-label .rpm-val {
                font-size: 15px;
            }

            .shift-indicator .gear-dot {
                width: 14px;
                height: 3px;
            }

            .shift-indicator .gear-dot.active {
                width: 22px;
            }
        }

        @media (max-width: 420px) {
            .dashboard {
                padding: 12px 10px 18px 10px;
                border-radius: 24px;
            }

            .header-left h1 {
                font-size: 13px;
            }

            .header-left .badge {
                font-size: 8px;
                padding: 2px 8px;
            }

            .header-right .engine-status {
                font-size: 9px;
            }

            .header-right .mute-btn {
                font-size: 10px;
                padding: 4px 10px;
            }

            .info-card {
                padding: 8px 6px;
            }

            .info-card .value {
                font-size: 16px;
            }

            .info-card.gear .value {
                font-size: 22px;
            }

            .gauge-container {
                padding: 10px 12px 12px 12px;
            }
        }

        /* ─── SCROLLBAR ─── */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #33334a;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="dashboard" id="app">

        <!-- HEADER -->
        <div class="header">
            <div class="header-left">
                <span class="badge">⛽ Diesel</span>
                <h1>RAM 3500</h1>
                <span class="sub">6.7L Cummins · Turbo Diesel</span>
            </div>
            <div class="header-right">
                <div class="engine-status">
                    <span class="dot"></span> <span id="statusText">Running</span>
                </div>
                <button class="mute-btn" id="muteBtn">🔊 Sound</button>
            </div>
        </div>

        <!-- MAIN GRID -->
        <div class="main-grid">

            <!-- LEFT: Gauges -->
            <div class="left-panel">

                <!-- RPM Gauge -->
                <div class="gauge-container">
                    <div class="gauge-label">
                        <span>Engine RPM</span>
                        <span class="rpm-val" id="rpmDisplay">800 <span class="unit">rpm</span></span>
                    </div>
                    <div class="gauge-track">
                        <div class="gauge-fill" id="rpmFill" style="width:0%;"></div>
                        <div class="tick-marks">
                            <span></span><span></span><span></span><span></span><span></span>
                            <span></span><span></span><span></span><span></span><span></span>
                            <span></span><span></span><span></span><span></span><span></span>
                            <span></span><span></span><span></span><span></span><span></span>
                        </div>
                    </div>
                    <div class="gauge-markers">
                        <span>0</span>
                        <span>1k</span>
                        <span>2k</span>
                        <span>3k</span>
                        <span>3.5k</span>
                    </div>
                </div>

                <!-- Info Row -->
                <div class="info-row">
                    <div class="info-card speed">
                        <div class="label">Speed</div>
                        <div class="value" id="speedDisplay">0 <span class="sub">mph</span></div>
                    </div>
                    <div class="info-card gear">
                        <div class="label">Gear</div>
                        <div class="value" id="gearDisplay">N <span class="sub"></span></div>
                    </div>
                    <div class="info-card throttle">
                        <div class="label">Throttle</div>
                        <div class="value" id="throttleDisplay">0 <span class="sub">%</span></div>
                    </div>
                </div>

                <!-- Shift dots -->
                <div class="shift-indicator" id="shiftDots">
                    <span class="gear-dot" data-g="1"></span>
                    <span class="gear-dot" data-g="2"></span>
                    <span class="gear-dot" data-g="3"></span>
                    <span class="gear-dot" data-g="4"></span>
                    <span class="gear-dot" data-g="5"></span>
                    <span class="gear-dot" data-g="6"></span>
                </div>
            </div>

            <!-- RIGHT: Pedal -->
            <div class="pedal-area">
                <div class="pedal-label">Throttle</div>
                <div class="pedal-track" id="pedalTrack">
                    <div class="pedal-fill" id="pedalFill"></div>
                    <div class="pedal-thumb" id="pedalThumb">
                        <span class="pedal-icon">⏫</span>
                    </div>
                </div>
                <div class="pedal-percent">
                    <span class="pct" id="pedalPercent">0</span> %
                </div>
            </div>

        </div>
    </div>

    <script>
        // ═══════════════════════════════════════════════════════════
        //  RAM 3500  6.7L CUMMINS  TURBO DIESEL  ·  ENGINE SYNTH
        // ═══════════════════════════════════════════════════════════

        (function() {
            'use strict';

            // ─── DOM REFS ───
            const rpmFill = document.getElementById('rpmFill');
            const rpmDisplay = document.getElementById('rpmDisplay');
            const speedDisplay = document.getElementById('speedDisplay');
            const gearDisplay = document.getElementById('gearDisplay');
            const throttleDisplay = document.getElementById('throttleDisplay');
            const pedalFill = document.getElementById('pedalFill');
            const pedalThumb = document.getElementById('pedalThumb');
            const pedalPercent = document.getElementById('pedalPercent');
            const pedalTrack = document.getElementById('pedalTrack');
            const muteBtn = document.getElementById('muteBtn');
            const statusText = document.getElementById('statusText');
            const shiftDots = document.querySelectorAll('.gear-dot');

            // ─── STATE ───
            let throttle = 0; // 0..1
            let targetThrottle = 0;
            let rpm = 800; // current RPM
            let targetRpm = 800;
            let gear = 0; // 0 = neutral, 1-6
            let speed = 0;
            let muted = false;
            let audioCtx = null;
            let engineNodes = null;
            let animId = null;

            // ─── CONSTANTS ───
            const IDLE_RPM = 800;
            const MAX_RPM = 3500;
            const REDLINE = 3400;
            const RPM_SMOOTHING = 0.12; // how fast RPM responds to throttle

            // Gear ratios (6-speed automatic)
            const GEAR_RATIOS = [0, 3.23, 1.83, 1.41, 1.00, 0.71, 0.61];
            const FINAL_DRIVE = 3.42;
            const TIRE_CIRCUMFERENCE = 2.54; // meters (approx 35" tires)
            const MPH_CONSTANT = 0.01136; // calibration factor

            // ─── AUDIO ENGINE ───
            class EngineAudio {
                constructor(ctx) {
                    this.ctx = ctx;
                    this.masterGain = ctx.createGain();
                    this.masterGain.gain.value = 0.25;
                    this.masterGain.connect(ctx.destination);

                    // ── Main engine tone ──
                    // Use 4 sawtooth oscillators with slight detune for thickness
                    this.oscs = [];
                    this.oscGains = [];
                    for (let i = 0; i < 4; i++) {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'sawtooth';
                        const detune = (i - 1.5) * 1.8 + (Math.random() - 0.5) * 0.6;
                        osc.detune.value = detune;
                        gain.gain.value = 0.12 / (1 + i * 0.3);
                        osc.connect(gain);
                        gain.connect(this.masterGain);
                        osc.start();
                        this.oscs.push(osc);
                        this.oscGains.push(gain);
                    }

                    // ── Exhaust rumble (low-pass filtered) ──
                    this.rumbleOsc = ctx.createOscillator();
                    this.rumbleGain = ctx.createGain();
                    this.rumbleFilter = ctx.createBiquadFilter();
                    this.rumbleFilter.type = 'lowpass';
                    this.rumbleFilter.frequency.value = 120;
                    this.rumbleFilter.Q.value = 0.7;
                    this.rumbleOsc.type = 'sawtooth';
                    this.rumbleGain.gain.value = 0.15;
                    this.rumbleOsc.connect(this.rumbleFilter);
                    this.rumbleFilter.connect(this.rumbleGain);
                    this.rumbleGain.connect(this.masterGain);
                    this.rumbleOsc.start();

                    // ── Diesel clatter (noise + bandpass) ──
                    const bufferSize = ctx.sampleRate * 0.05;
                    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        data[i] = (Math.random() * 2 - 1) * Math.exp(-i / bufferSize * 6);
                    }
                    this.clatterNode = ctx.createBufferSource();
                    this.clatterNode.buffer = buffer;
                    this.clatterNode.loop = true;
                    this.clatterGain = ctx.createGain();
                    this.clatterFilter = ctx.createBiquadFilter();
                    this.clatterFilter.type = 'bandpass';
                    this.clatterFilter.frequency.value = 900;
                    this.clatterFilter.Q.value = 1.2;
                    this.clatterGain.gain.value = 0.06;
                    this.clatterNode.connect(this.clatterFilter);
                    this.clatterFilter.connect(this.clatterGain);
                    this.clatterGain.connect(this.masterGain);
                    this.clatterNode.start();

                    // ── Turbo whistle ──
                    this.turboOsc = ctx.createOscillator();
                    this.turboGain = ctx.createGain();
                    this.turboOsc.type = 'sine';
                    this.turboGain.gain.value = 0.0;
                    this.turboOsc.connect(this.turboGain);
                    this.turboGain.connect(this.masterGain);
                    this.turboOsc.start();

                    // ── Additional harmonics for richness ──
                    this.harmonics = [];
                    for (let h = 2; h <= 5; h++) {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = 'sawtooth';
                        osc.detune.value = (Math.random() - 0.5) * 1.2;
                        gain.gain.value = 0.04 / (h * 0.5);
                        osc.connect(gain);
                        gain.connect(this.masterGain);
                        osc.start();
                        this.harmonics.push({ osc, gain, harmonic: h });
                    }

                    // ── State ──
                    this.currentRpm = 800;
                    this.currentThrottle = 0;

                    // ── Context state ──
                    this.isRunning = true;
                }

                update(rpmVal, throttleVal) {
                    this.currentRpm = rpmVal;
                    this.currentThrottle = throttleVal;

                    // Clamp
                    const clampedRpm = Math.max(400, Math.min(MAX_RPM, rpmVal));
                    const freq = clampedRpm / 20; // fundamental firing frequency (6-cyl 4-stroke)

                    // 1. Main oscillators
                    for (let i = 0; i < this.oscs.length; i++) {
                        this.oscs[i].frequency.setTargetAtTime(freq, this.ctx.currentTime, 0.04);
                        // Volume increases with RPM
                        const vol = 0.08 + (clampedRpm / MAX_RPM) * 0.14;
                        this.oscGains[i].gain.setTargetAtTime(vol / (1 + i * 0.3), this.ctx.currentTime, 0.04);
                    }

                    // 2. Harmonics
                    for (const h of this.harmonics) {
                        const hFreq = freq * h.harmonic;
                        h.osc.frequency.setTargetAtTime(hFreq, this.ctx.currentTime, 0.04);
                        const hVol = 0.03 + (clampedRpm / MAX_RPM) * 0.06;
                        h.gain.gain.setTargetAtTime(hVol / (h.harmonic * 0.4), this.ctx.currentTime, 0.04);
                    }

                    // 3. Rumble
                    this.rumbleOsc.frequency.setTargetAtTime(freq * 0.5, this.ctx.currentTime, 0.06);
                    this.rumbleFilter.frequency.setTargetAtTime(60 + (clampedRpm / MAX_RPM) * 180, this.ctx.currentTime,
                    0.06);
                    const rumbleVol = 0.08 + (clampedRpm / MAX_RPM) * 0.18;
                    this.rumbleGain.gain.setTargetAtTime(rumbleVol, this.ctx.currentTime, 0.06);

                    // 4. Clatter — modulate with firing frequency
                    const clatterRate = clampedRpm / 20;
                    const clatterFreq = 600 + (clampedRpm / MAX_RPM) * 800;
                    this.clatterFilter.frequency.setTargetAtTime(clatterFreq, this.ctx.currentTime, 0.06);
                    // Clatter volume: higher at idle/mid, lower at high RPM
                    const clatterVol = 0.04 + 0.06 * Math.sin(clampedRpm / MAX_RPM * Math.PI) * 0.8;
                    this.clatterGain.gain.setTargetAtTime(clatterVol, this.ctx.currentTime, 0.06);
                    // Modulate clatter amplitude at firing rate (creates diesel knock rhythm)
                    const mod = 0.5 + 0.5 * Math.sin(this.ctx.currentTime * clatterRate * 2 * Math.PI);
                    this.clatterGain.gain.setTargetAtTime(clatterVol * (0.5 + 0.5 * mod), this.ctx.currentTime, 0.02);

                    // 5. Turbo whistle
                    const turboBase = 3000 + (clampedRpm / MAX_RPM) * 7000;
                    const turboFreq = turboBase + throttleVal * 4000;
                    this.turboOsc.frequency.setTargetAtTime(turboFreq, this.ctx.currentTime, 0.04);
                    const turboVol = 0.0 + throttleVal * 0.08 * (0.3 + 0.7 * (clampedRpm / MAX_RPM));
                    this.turboGain.gain.setTargetAtTime(turboVol, this.ctx.currentTime, 0.04);

                    // 6. Master volume — slight increase with RPM
                    const masterVol = 0.20 + (clampedRpm / MAX_RPM) * 0.15;
                    this.masterGain.gain.setTargetAtTime(masterVol, this.ctx.currentTime, 0.06);
                }

                setMuted(mute) {
                    this.masterGain.gain.setTargetAtTime(mute ? 0 : 0.25, this.ctx.currentTime, 0.05);
                }

                dispose() {
                    // Stop all oscillators and nodes
                    for (const osc of this.oscs) {
                        try { osc.stop(); } catch (_) {}
                    }
                    try { this.rumbleOsc.stop(); } catch (_) {}
                    try { this.turboOsc.stop(); } catch (_) {}
                    try { this.clatterNode.stop(); } catch (_) {}
                    for (const h of this.harmonics) {
                        try { h.osc.stop(); } catch (_) {}
                    }
                    this.isRunning = false;
                }
            }

            // ─── INIT AUDIO ───
            function initAudio() {
                if (audioCtx) return;
                try {
                    audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                    engineNodes = new EngineAudio(audioCtx);
                } catch (e) {
                    console.warn('Web Audio not supported:', e);
                }
            }

            // ─── UPDATE ENGINE ───
            function updateEngine() {
                if (!engineNodes || !audioCtx || audioCtx.state === 'closed') return;

                // Smooth throttle
                throttle += (targetThrottle - throttle) * 0.18;

                // Calculate target RPM based on throttle
                const target = IDLE_RPM + (MAX_RPM - IDLE_RPM) * throttle;
                targetRpm = target;

                // Smooth RPM
                rpm += (targetRpm - rpm) * RPM_SMOOTHING;
                rpm = Math.max(400, Math.min(MAX_RPM, rpm));

                // ── Gear logic ──
                // Upshift when RPM > 2900 and throttle > 0.15
                // Downshift when RPM < 1100 or throttle < 0.05
                if (gear === 0) {
                    if (throttle > 0.02) gear = 1;
                } else {
                    if (rpm > 2900 && throttle > 0.15 && gear < 6) {
                        gear++;
                    } else if (rpm < 1100 && gear > 1) {
                        gear--;
                    } else if (throttle < 0.03 && rpm < 1200 && gear > 1) {
                        gear--;
                    }
                    // Prevent gear 0 while moving
                    if (gear === 0 && throttle > 0.01) gear = 1;
                    // Max RPM limiter: force upshift if at redline
                    if (rpm > REDLINE && gear < 6) {
                        gear++;
                    }
                }

                // Clamp gear
                gear = Math.max(0, Math.min(6, gear));

                // ── Speed calculation ──
                if (gear === 0) {
                    speed = 0;
                } else {
                    const ratio = GEAR_RATIOS[gear] || 1;
                    const overall = ratio * FINAL_DRIVE;
                    // Speed (mph) = (RPM * tire_circumference * 60) / (overall * 1609.34 * 1000) * 0.621371
                    // Simplified: speed = RPM / overall * CONSTANT
                    speed = (rpm / overall) * MPH_CONSTANT;
                    speed = Math.max(0, Math.min(120, speed));
                }

                // ── Update audio ──
                if (!muted) {
                    engineNodes.update(rpm, throttle);
                } else {
                    engineNodes.update(800, 0);
                }

                // ── Update UI ──
                updateUI();
            }

            // ─── UPDATE UI ───
            function updateUI() {
                const rpmPercent = ((rpm - 400) / (MAX_RPM - 400)) * 100;
                rpmFill.style.width = Math.min(100, Math.max(0, rpmPercent)) + '%';
                rpmDisplay.innerHTML = `${Math.round(rpm)} <span class="unit">rpm</span>`;

                const speedRounded = Math.round(speed);
                speedDisplay.innerHTML = `${speedRounded} <span class="sub">mph</span>`;

                const gearLabel = gear === 0 ? 'N' : gear;
                gearDisplay.innerHTML = `${gearLabel} <span class="sub"></span>`;

                const throttlePercent = Math.round(throttle * 100);
                throttleDisplay.innerHTML = `${throttlePercent} <span class="sub">%</span>`;

                // Pedal
                const pct = throttle * 100;
                pedalFill.style.height = pct + '%';
                const thumbPos = 100 - pct;
                pedalThumb.style.bottom = thumbPos + '%';
                pedalPercent.textContent = Math.round(pct);

                // Shift dots
                shiftDots.forEach((dot, idx) => {
                    const g = parseInt(dot.dataset.g, 10);
                    dot.classList.toggle('active', g === gear);
                });
            }

            // ─── PEDAL INTERACTION ───
            function setThrottle(val) {
                targetThrottle = Math.max(0, Math.min(1, val));
                // Auto-start audio on first interaction
                if (!audioCtx) {
                    initAudio();
                } else if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            }

            function handlePedalEvent(clientY) {
                const rect = pedalTrack.getBoundingClientRect();
                const y = (clientY - rect.top) / rect.height;
                const val = 1 - Math.max(0, Math.min(1, y));
                setThrottle(val);
            }

            // Mouse events
            pedalTrack.addEventListener('mousedown', (e) => {
                e.preventDefault();
                handlePedalEvent(e.clientY);
                const onMove = (ev) => {
                    ev.preventDefault();
                    handlePedalEvent(ev.clientY);
                };
                const onUp = () => {
                    document.removeEventListener('mousemove', onMove);
                    document.removeEventListener('mouseup', onUp);
                    pedalThumb.classList.remove('active');
                };
                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onUp);
                pedalThumb.classList.add('active');
            });

            // Touch events
            pedalTrack.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                if (touch) {
                    handlePedalEvent(touch.clientY);
                    pedalThumb.classList.add('active');
                }
            }, { passive: false });

            pedalTrack.addEventListener('touchmove', (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                if (touch) {
                    handlePedalEvent(touch.clientY);
                }
            }, { passive: false });

            pedalTrack.addEventListener('touchend', (e) => {
                e.preventDefault();
                pedalThumb.classList.remove('active');
            }, { passive: false });

            // ─── MUTE ───
            muteBtn.addEventListener('click', () => {
                muted = !muted;
                muteBtn.textContent = muted ? '🔇 Muted' : '🔊 Sound';
                muteBtn.classList.toggle('muted', muted);
                statusText.textContent = muted ? 'Muted' : 'Running';
                if (engineNodes) {
                    engineNodes.setMuted(muted);
                }
                if (!muted && audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            });

            // ─── ANIMATION LOOP ───
            function loop() {
                updateEngine();
                animId = requestAnimationFrame(loop);
            }

            // ─── START ───
            // Initialize audio context on first user interaction via pedal
            // But we can start the loop right away for UI
            function startLoop() {
                if (animId) return;
                // Set initial gear to Neutral
                gear = 0;
                rpm = IDLE_RPM;
                targetRpm = IDLE_RPM;
                throttle = 0;
                targetThrottle = 0;
                speed = 0;
                loop();
            }

            startLoop();

            // ─── KEYBOARD SHORTCUTS ───
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowUp' || e.key === '=') {
                    e.preventDefault();
                    setThrottle(Math.min(1, targetThrottle + 0.05));
                } else if (e.key === 'ArrowDown' || e.key === '-') {
                    e.preventDefault();
                    setThrottle(Math.max(0, targetThrottle - 0.05));
                } else if (e.key === ' ' || e.key === 'm') {
                    e.preventDefault();
                    muteBtn.click();
                } else if (e.key === 'r' || e.key === 'R') {
                    e.preventDefault();
                    setThrottle(0);
                    gear = 0;
                }
            });

            // ─── CLEANUP ───
            window.addEventListener('beforeunload', () => {
                if (animId) cancelAnimationFrame(animId);
                if (engineNodes) {
                    engineNodes.dispose();
                }
                if (audioCtx) {
                    try { audioCtx.close(); } catch (_) {}
                }
            });

            // ─── AUTO-RESUME ON TAP ───
            document.addEventListener('click', () => {
                if (!audioCtx) {
                    initAudio();
                } else if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            }, { once: true });

            console.log('🚛 RAM 3500 6.7L Cummins · Turbo Diesel Simulator');
            console.log('🎮  Use pedal or keyboard:  ↑  ↓  to throttle,  M  to mute,  R  to reset');

        })();
    </script>

</body>
