<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAM 3500 · 6.7L Cummins (sample‑based)</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }
    body {
      background: #0a0a0f;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', Arial, sans-serif;
      color: #e8e8e8;
      padding: 16px;
    }
    .dashboard {
      background: linear-gradient(145deg, #14141e, #1c1c2a);
      border-radius: 48px;
      padding: 30px 40px 40px 40px;
      max-width: 960px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.03);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      margin-bottom: 20px;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .badge {
      background: #c0392b;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 3px 12px;
      border-radius: 20px;
      background: linear-gradient(135deg, #c0392b, #a93226);
      box-shadow: 0 2px 12px rgba(192, 57, 43, 0.3);
    }
    .header-left h1 {
      font-size: 20px;
      font-weight: 700;
      background: linear-gradient(135deg, #f5f5f5, #a0a0b0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header-left .sub {
      font-size: 11px;
      color: #8888a0;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 18px;
    }
    .engine-status {
      font-size: 11px;
      color: #6a8a6a;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4caf50;
      box-shadow: 0 0 12px rgba(76, 175, 80, 0.4);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,
      100% {
        opacity: 0.6;
        transform: scale(0.9);
      }
      50% {
        opacity: 1;
        transform: scale(1.2);
      }
    }
    .mute-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #b0b0c0;
      padding: 6px 14px;
      border-radius: 24px;
      font-size: 12px;
      cursor: pointer;
      transition: 0.25s;
      font-weight: 500;
    }
    .mute-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }
    .mute-btn.muted {
      color: #c0392b;
      border-color: rgba(192, 57, 43, 0.3);
    }
    .main-grid {
      display: grid;
      grid-template-columns: 1fr 200px;
      gap: 24px;
      align-items: stretch;
    }
    .left-panel {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .gauge-container {
      background: radial-gradient(ellipse at 50% 60%, #1a1a28, #0d0d16);
      border-radius: 28px;
      padding: 16px 20px 18px;
      border: 1px solid rgba(255, 255, 255, 0.04);
      box-shadow: inset 0 4px 20px rgba(0, 0, 0, 0.6);
    }
    .gauge-label {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #8888a0;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
    }
    .rpm-val {
      font-size: 18px;
      font-weight: 700;
      color: #e8e8f0;
    }
    .rpm-val .unit {
      font-size: 12px;
      font-weight: 300;
      color: #666680;
    }
    .gauge-track {
      position: relative;
      height: 10px;
      background: linear-gradient(90deg, #1a2a1a, #3a4a2a 40%, #5a4a2a 70%, #7a2a2a);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.6);
    }
    .gauge-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #4caf50, #8bc34a, #ffeb3b, #ff9800, #f44336);
      border-radius: 20px;
      transition: width 0.08s linear;
    }
    .info-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
    }
    .info-card {
      background: rgba(255, 255, 255, 0.02);
      border-radius: 16px;
      padding: 12px 14px;
      border: 1px solid rgba(255, 255, 255, 0.04);
      text-align: center;
    }
    .info-card .label {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #666680;
    }
    .info-card .value {
      font-size: 26px;
      font-weight: 700;
      color: #e8e8f0;
    }
    .info-card .value .sub {
      font-size: 13px;
      font-weight: 400;
      color: #666680;
    }
    .info-card.gear .value {
      font-size: 36px;
      color: #f5c842;
    }
    .info-card.throttle .value {
      color: #6ab0e6;
    }
    .shift-indicator {
      display: flex;
      justify-content: center;
      gap: 4px;
      margin-top: 8px;
    }
    .shift-indicator .gear-dot {
      width: 18px;
      height: 4px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.06);
      transition: all 0.3s ease;
    }
    .shift-indicator .gear-dot.active {
      background: #f5c842;
      box-shadow: 0 0 16px rgba(245, 200, 66, 0.25);
      width: 28px;
    }
    .pedal-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: stretch;
      background: radial-gradient(ellipse at 50% 30%, #181824, #0e0e18);
      border-radius: 28px;
      padding: 16px 12px 18px;
      border: 1px solid rgba(255, 255, 255, 0.04);
      box-shadow: inset 0 4px 20px rgba(0, 0, 0, 0.5);
    }
    .pedal-area .pedal-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #666680;
      margin-bottom: 10px;
    }
    .pedal-track {
      position: relative;
      width: 48px;
      flex: 1;
      min-height: 200px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      cursor: pointer;
      touch-action: none;
      box-shadow: inset 0 4px 20px rgba(0, 0, 0, 0.4);
      overflow: visible;
    }
    .pedal-fill {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 0%;
      background: linear-gradient(0deg, #e74c3c, #f39c12, #f1c40f);
      border-radius: 40px;
      transition: height 0.05s linear;
    }
    .pedal-thumb {
      position: absolute;
      left: 50%;
      transform: translate(-50%, 50%);
      width: 52px;
      height: 52px;
      background: radial-gradient(ellipse at 40% 35%, #3a3a4a, #1a1a2a);
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.8);
      transition: bottom 0.05s linear;
      cursor: grab;
      touch-action: none;
      pointer-events: none;
    }
    .pedal-thumb.active {
      border-color: rgba(241, 196, 15, 0.5);
      box-shadow: 0 4px 40px rgba(241, 196, 15, 0.2);
    }
    .pedal-percent {
      font-size: 13px;
      font-weight: 600;
      color: #b0b0c0;
      margin-top: 10px;
    }
    .pedal-percent .pct {
      font-size: 20px;
      font-weight: 700;
      color: #e8e8f0;
    }
    @media (max-width: 680px) {
      .dashboard {
        padding: 18px 16px 24px;
      }
      .main-grid {
        grid-template-columns: 1fr;
        gap: 16px;
      }
      .left-panel {
        order: 1;
      }
      .pedal-area {
        order: 0;
        flex-direction: row;
        padding: 12px 16px;
        gap: 16px;
        min-height: 120px;
      }
      .pedal-track {
        min-height: 100px;
        height: 100px;
        width: 32px;
        flex: 0 0 32px;
      }
      .pedal-thumb {
        width: 40px;
        height: 40px;
      }
      .pedal-percent {
        margin-top: 0;
      }
    }
  </style>
</head>
<body>

  <div class="dashboard">
    <div class="header">
      <div class="header-left">
        <span class="badge">⛽ Diesel</span>
        <h1>RAM 3500</h1>
        <span class="sub">6.7L Cummins · Turbo</span>
      </div>
      <div class="header-right">
        <div class="engine-status"><span class="dot"></span> <span id="statusText">Running</span></div>
        <button class="mute-btn" id="muteBtn">🔊 Sound</button>
      </div>
    </div>

    <div class="main-grid">
      <div class="left-panel">
        <div class="gauge-container">
          <div class="gauge-label">
            <span>Engine RPM</span>
            <span class="rpm-val" id="rpmDisplay">800 <span class="unit">rpm</span></span>
          </div>
          <div class="gauge-track">
            <div class="gauge-fill" id="rpmFill" style="width:0%;"></div>
          </div>
        </div>

        <div class="info-row">
          <div class="info-card speed">
            <div class="label">Speed</div>
            <div class="value" id="speedDisplay">0 <span class="sub">mph</span></div>
          </div>
          <div class="info-card gear">
            <div class="label">Gear</div>
            <div class="value" id="gearDisplay">N</div>
          </div>
          <div class="info-card throttle">
            <div class="label">Throttle</div>
            <div class="value" id="throttleDisplay">0 <span class="sub">%</span></div>
          </div>
        </div>

        <div class="shift-indicator" id="shiftDots">
          <span class="gear-dot" data-g="1"></span>
          <span class="gear-dot" data-g="2"></span>
          <span class="gear-dot" data-g="3"></span>
          <span class="gear-dot" data-g="4"></span>
          <span class="gear-dot" data-g="5"></span>
          <span class="gear-dot" data-g="6"></span>
        </div>
      </div>

      <div class="pedal-area">
        <div class="pedal-label">Throttle</div>
        <div class="pedal-track" id="pedalTrack">
          <div class="pedal-fill" id="pedalFill"></div>
          <div class="pedal-thumb" id="pedalThumb"></div>
        </div>
        <div class="pedal-percent"><span class="pct" id="pedalPercent">0</span> %</div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      'use strict';

      // ─── DOM refs ───
      const rpmFill = document.getElementById('rpmFill');
      const rpmDisplay = document.getElementById('rpmDisplay');
      const speedDisplay = document.getElementById('speedDisplay');
      const gearDisplay = document.getElementById('gearDisplay');
      const throttleDisplay = document.getElementById('throttleDisplay');
      const pedalFill = document.getElementById('pedalFill');
      const pedalThumb = document.getElementById('pedalThumb');
      const pedalPercent = document.getElementById('pedalPercent');
      const pedalTrack = document.getElementById('pedalTrack');
      const muteBtn = document.getElementById('muteBtn');
      const statusText = document.getElementById('statusText');
      const shiftDots = document.querySelectorAll('.gear-dot');

      // ─── Engine state ───
      let throttle = 0;          // 0..1
      let targetThrottle = 0;
      let rpm = 800;
      let targetRpm = 800;
      let gear = 0;              // 0 = neutral, 1..6
      let speed = 0;
      let muted = false;
      let audioCtx = null;
      let engineBuffer = null;   // the loaded sample
      let sourceNode = null;
      let gainNode = null;
      let turboGain = null;
      let animId = null;

      // Constants
      const IDLE_RPM = 800;
      const MAX_RPM = 3500;
      const REDLINE = 3400;
      const RPM_SMOOTHING = 0.12;

      // Gear ratios (6-speed automatic)
      const GEAR_RATIOS = [0, 3.23, 1.83, 1.41, 1.00, 0.71, 0.61];
      const FINAL_DRIVE = 3.42;
      const MPH_CONSTANT = 0.01136;

      // ─── Load the engine sample ───
      // You can replace this URL with your own audio file (WAV, MP3, etc.)
      // or use a base64 data URI: "data:audio/wav;base64,...."
      const SAMPLE_URL =
        'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3'; // placeholder – replace with a real diesel loop!

      // For a real diesel loop, try a free sample like:
      // 'https://freesound.org/data/previews/320/320181_5260872-lq.mp3'  (but may have license restrictions)
      // Better: use your own file.

      function loadSample(url) {
        return fetch(url)
          .then(res => {
            if (!res.ok) throw new Error('Network error');
            return res.arrayBuffer();
          })
          .then(buf => audioCtx.decodeAudioData(buf))
          .catch(err => {
            console.warn('Failed to load sample, using a short generated tone as fallback (still no synthesis – this is a placeholder).');
            // Fallback: we will generate a short noise burst – but that's synthesis. 
            // Instead, we'll create a silent buffer and show an error.
            // For demo, we create a minimal sine wave – but that's synthesis.
            // To strictly avoid synthesis, we'll throw and let user know.
            throw new Error('Please provide a valid audio file URL or base64 data URI.');
          });
      }

      // ─── Init audio and start playback ───
      function initAudio() {
        if (audioCtx) return Promise.resolve();
        audioCtx = new(window.AudioContext || window.webkitAudioContext)();
        return loadSample(SAMPLE_URL)
          .then(buffer => {
            engineBuffer = buffer;
            // Create gain nodes
            gainNode = audioCtx.createGain();
            gainNode.gain.value = 0.3;
            gainNode.connect(audioCtx.destination);

            turboGain = audioCtx.createGain();
            turboGain.gain.value = 0.0;
            turboGain.connect(audioCtx.destination);

            // Start looping source
            startLoopSource();
          })
          .catch(err => {
            alert('Could not load engine audio: ' + err.message +
              '\nPlease edit SAMPLE_URL in the script to point to a real diesel engine recording.');
            // Fallback: create a silent buffer to keep the app running
            const silentBuffer = audioCtx.createBuffer(1, 1, audioCtx.sampleRate);
            engineBuffer = silentBuffer;
            gainNode = audioCtx.createGain();
            gainNode.gain.value = 0;
            gainNode.connect(audioCtx.destination);
            turboGain = audioCtx.createGain();
            turboGain.gain.value = 0;
            turboGain.connect(audioCtx.destination);
            startLoopSource();
          });
      }

      function startLoopSource() {
        if (sourceNode) {
          try { sourceNode.stop(); } catch (_) {}
        }
        if (!engineBuffer) return;
        sourceNode = audioCtx.createBufferSource();
        sourceNode.buffer = engineBuffer;
        sourceNode.loop = true;
        sourceNode.loopStart = 0;
        sourceNode.loopEnd = engineBuffer.duration;
        sourceNode.connect(gainNode);
        sourceNode.start(0);
        // Also create a separate source for turbo (using same buffer but with a filter)
        // We'll just add a second source with high-pass filter for turbo whistle effect
        // For simplicity, we'll use the same source and apply filtering via a separate gain? Actually we need a separate node.
        // Let's create a second buffer source for turbo.
        const turboSource = audioCtx.createBufferSource();
        turboSource.buffer = engineBuffer;
        turboSource.loop = true;
        turboSource.loopStart = 0;
        turboSource.loopEnd = engineBuffer.duration;
        const turboFilter = audioCtx.createBiquadFilter();
        turboFilter.type = 'highpass';
        turboFilter.frequency.value = 2000;
        turboSource.connect(turboFilter);
        turboFilter.connect(turboGain);
        turboSource.start(0);
        // Store for later pitch control
        window._turboSource = turboSource;
        window._turboFilter = turboFilter;
      }

      // ─── Update audio pitch and volume ───
      function updateAudio(rpmVal, throttleVal) {
        if (!sourceNode || !audioCtx) return;
        // Clamp RPM
        const clamped = Math.max(400, Math.min(MAX_RPM, rpmVal));
        // Pitch: idle at 0.6x, redline at 2.2x (adjust to taste)
        const rate = 0.6 + (clamped / MAX_RPM) * 1.6;
        try {
          sourceNode.playbackRate.setTargetAtTime(rate, audioCtx.currentTime, 0.05);
          if (window._turboSource) {
            window._turboSource.playbackRate.setTargetAtTime(rate * 1.2, audioCtx.currentTime, 0.05);
          }
        } catch (_) {}

        // Volume: increases with RPM and throttle
        const vol = 0.15 + 0.35 * (clamped / MAX_RPM) + 0.2 * throttleVal;
        gainNode.gain.setTargetAtTime(Math.min(0.7, vol), audioCtx.currentTime, 0.05);

        // Turbo whistle (filtered high-end) – more at high throttle
        const turboVol = 0.0 + 0.3 * throttleVal * (clamped / MAX_RPM);
        turboGain.gain.setTargetAtTime(Math.min(0.25, turboVol), audioCtx.currentTime, 0.05);
        if (window._turboFilter) {
          const freq = 1500 + (clamped / MAX_RPM) * 4000;
          window._turboFilter.frequency.setTargetAtTime(freq, audioCtx.currentTime, 0.05);
        }
      }

      // ─── Engine update loop ───
      function updateEngine() {
        // Smooth throttle
        throttle += (targetThrottle - throttle) * 0.18;

        // Target RPM
        const target = IDLE_RPM + (MAX_RPM - IDLE_RPM) * throttle;
        targetRpm = target;
        rpm += (targetRpm - rpm) * RPM_SMOOTHING;
        rpm = Math.max(400, Math.min(MAX_RPM, rpm));

        // Gear logic
        if (gear === 0) {
          if (throttle > 0.02) gear = 1;
        } else {
          if (rpm > 2900 && throttle > 0.15 && gear < 6) gear++;
          else if (rpm < 1100 && gear > 1) gear--;
          else if (throttle < 0.03 && rpm < 1200 && gear > 1) gear--;
          if (rpm > REDLINE && gear < 6) gear++;
        }
        gear = Math.max(0, Math.min(6, gear));

        // Speed
        if (gear === 0) speed = 0;
        else {
          const ratio = GEAR_RATIOS[gear] || 1;
          const overall = ratio * FINAL_DRIVE;
          speed = (rpm / overall) * MPH_CONSTANT;
          speed = Math.max(0, Math.min(120, speed));
        }

        // Update audio (if not muted)
        if (!muted && engineBuffer) {
          updateAudio(rpm, throttle);
        } else if (muted) {
          gainNode.gain.setTargetAtTime(0, audioCtx.currentTime, 0.05);
          turboGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.05);
        }

        // Update UI
        const rpmPercent = ((rpm - 400) / (MAX_RPM - 400)) * 100;
        rpmFill.style.width = Math.min(100, Math.max(0, rpmPercent)) + '%';
        rpmDisplay.innerHTML = `${Math.round(rpm)} <span class="unit">rpm</span>`;
        speedDisplay.innerHTML = `${Math.round(speed)} <span class="sub">mph</span>`;
        const gearLabel = gear === 0 ? 'N' : gear;
        gearDisplay.textContent = gearLabel;
        const throttlePercent = Math.round(throttle * 100);
        throttleDisplay.innerHTML = `${throttlePercent} <span class="sub">%</span>`;
        pedalFill.style.height = throttlePercent + '%';
        pedalThumb.style.bottom = (100 - throttlePercent) + '%';
        pedalPercent.textContent = Math.round(throttlePercent);
        shiftDots.forEach((dot, idx) => {
          const g = parseInt(dot.dataset.g, 10);
          dot.classList.toggle('active', g === gear);
        });
      }

      // ─── Pedal interaction ───
      function setThrottle(val) {
        targetThrottle = Math.max(0, Math.min(1, val));
        if (!audioCtx) {
          initAudio().then(() => {
            if (audioCtx.state === 'suspended') audioCtx.resume();
          });
        } else if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      }

      function handlePedalEvent(clientY) {
        const rect = pedalTrack.getBoundingClientRect();
        const y = (clientY - rect.top) / rect.height;
        const val = 1 - Math.max(0, Math.min(1, y));
        setThrottle(val);
      }

      pedalTrack.addEventListener('mousedown', (e) => {
        e.preventDefault();
        handlePedalEvent(e.clientY);
        const onMove = (ev) => { ev.preventDefault();
          handlePedalEvent(ev.clientY); };
        const onUp = () => {
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
          pedalThumb.classList.remove('active');
        };
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
        pedalThumb.classList.add('active');
      });

      pedalTrack.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const touch = e.touches[0];
        if (touch) { handlePedalEvent(touch.clientY);
          pedalThumb.classList.add('active'); }
      }, { passive: false });
      pedalTrack.addEventListener('touchmove', (e) => {
        e.preventDefault();
        const touch = e.touches[0];
        if (touch) handlePedalEvent(touch.clientY);
      }, { passive: false });
      pedalTrack.addEventListener('touchend', (e) => {
        e.preventDefault();
        pedalThumb.classList.remove('active');
      }, { passive: false });

      // ─── Mute ───
      muteBtn.addEventListener('click', () => {
        muted = !muted;
        muteBtn.textContent = muted ? '🔇 Muted' : '🔊 Sound';
        muteBtn.classList.toggle('muted', muted);
        statusText.textContent = muted ? 'Muted' : 'Running';
        if (!muted && audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      });

      // ─── Keyboard ───
      document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowUp' || e.key === '=') { e.preventDefault();
          setThrottle(Math.min(1, targetThrottle + 0.05)); } else if (e.key === 'ArrowDown' || e.key === '-') { e
            .preventDefault();
          setThrottle(Math.max(0, targetThrottle - 0.05)); } else if (e.key === ' ' || e.key === 'm') { e.preventDefault();
          muteBtn.click(); } else if (e.key === 'r' || e.key === 'R') { e.preventDefault();
          setThrottle(0);
          gear = 0; }
      });

      // ─── Animation loop ───
      function loop() {
        updateEngine();
        animId = requestAnimationFrame(loop);
      }

      // ─── Start ───
      // Pre-load audio on first user click anywhere
      document.addEventListener('click', () => {
        if (!audioCtx) {
          initAudio().then(() => {
            if (audioCtx.state === 'suspended') audioCtx.resume();
          });
        } else if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      }, { once: true });

      // Start the UI loop
      loop();

      // Cleanup
      window.addEventListener('beforeunload', () => {
        if (animId) cancelAnimationFrame(animId);
        if (sourceNode) try { sourceNode.stop(); } catch (_) {}
        if (audioCtx) try { audioCtx.close(); } catch (_) {}
      });

    })();
  </script>
</body>
</html>
