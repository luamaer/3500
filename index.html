<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RAM 3500 6.7L Cummins Turbo Diesel</title>
    <style>
        /* ─────────── GLOBAL RESET & BASE ─────────── */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: #0a0a0f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 16px;
            margin: 0;
        }

        /* ─────────── MAIN DASHBOARD ─────────── */
        .dashboard {
            background: linear-gradient(145deg, #14141e, #1a1a28);
            border-radius: 40px;
            padding: 30px 40px 40px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.04);
            max-width: 1100px;
            width: 100%;
            border: 1px solid #2a2a3e;
        }

        /* ─────────── HEADER / BRAND ─────────── */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 1px solid #2a2a3e;
        }
        .header h1 {
            font-weight: 700;
            font-size: 20px;
            letter-spacing: 1.5px;
            color: #d4d4e8;
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
        }
        .header h1 span {
            color: #f5b342;
            font-weight: 300;
        }
        .header .badge {
            background: #1e2a3a;
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 13px;
            color: #aab;
            border: 1px solid #334;
            letter-spacing: 0.5px;
        }
        .header .badge i {
            font-style: normal;
            color: #f5b342;
            font-weight: 700;
        }

        /* ─────────── GAUGES ROW ─────────── */
        .gauges {
            display: flex;
            justify-content: space-between;
            align-items: stretch;
            gap: 20px;
            margin-bottom: 28px;
        }

        .gauge {
            flex: 1;
            background: #0e0e18;
            border-radius: 24px;
            padding: 14px 12px 12px 12px;
            border: 1px solid #26263a;
            box-shadow: inset 0 4px 12px rgba(0, 0, 0, 0.6);
            text-align: center;
            min-width: 0;
        }
        .gauge .label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #6a6a88;
            margin-bottom: 6px;
        }
        .gauge .value {
            font-size: 28px;
            font-weight: 700;
            color: #eee;
            font-variant-numeric: tabular-nums;
            letter-spacing: 1px;
            transition: color 0.15s;
        }
        .gauge .value .unit {
            font-size: 14px;
            font-weight: 400;
            color: #6a6a88;
            margin-left: 4px;
        }
        .gauge .value.highlight {
            color: #f5b342;
        }

        /* ─────────── TACHOMETER (circular) ─────────── */
        .tacho-wrap {
            flex: 1.6;
            position: relative;
            background: #0e0e18;
            border-radius: 24px;
            padding: 10px;
            border: 1px solid #26263a;
            box-shadow: inset 0 4px 12px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 0;
        }
        .tacho-wrap .label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #6a6a88;
            margin-bottom: 4px;
        }
        .tacho-canvas-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 1/1;
            max-width: 220px;
            margin: 0 auto;
        }
        .tacho-canvas-wrap canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
            border-radius: 50%;
            background: #07070e;
        }
        .tacho-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
        }
        .tacho-center .rpm-val {
            font-size: 26px;
            font-weight: 700;
            color: #eee;
            line-height: 1;
        }
        .tacho-center .rpm-label {
            font-size: 9px;
            color: #6a6a88;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-top: 2px;
        }

        /* ─────────── PEDAL AREA ─────────── */
        .pedal-area {
            display: flex;
            align-items: stretch;
            gap: 30px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        /* ─── PEDAL ─── */
        .pedal-container {
            flex: 0 0 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .pedal-container .pedal-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #6a6a88;
        }
        .pedal-track {
            width: 60px;
            height: 260px;
            background: #0c0c16;
            border-radius: 40px;
            border: 2px solid #26263a;
            position: relative;
            box-shadow: inset 0 4px 20px rgba(0, 0, 0, 0.8);
            cursor: pointer;
            touch-action: none;
            overflow: visible;
        }
        .pedal-track .pedal-fill {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            border-radius: 0 0 36px 36px;
            background: linear-gradient(180deg, #f5b342, #d4851a);
            transition: height 0.08s ease-out;
            box-shadow: 0 0 24px rgba(245, 179, 66, 0.25);
            height: 0%;
        }
        .pedal-track .pedal-fill::after {
            content: '';
            position: absolute;
            top: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 16px;
            height: 16px;
            background: #f5b342;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(245, 179, 66, 0.5);
            border: 2px solid #1a1a28;
        }
        .pedal-track .pedal-grip {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 44px;
            height: 20px;
            background: rgba(20, 20, 30, 0.5);
            border-radius: 10px 10px 0 0;
            border-top: 2px solid #3a3a52;
            pointer-events: none;
            transition: bottom 0.08s ease-out;
            bottom: 0%;
        }
        .pedal-track .pedal-grip::before {
            content: '▾';
            display: block;
            text-align: center;
            font-size: 12px;
            color: #5a5a7a;
            line-height: 20px;
        }
        .pedal-track .pedal-percent {
            position: absolute;
            top: -28px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 16px;
            font-weight: 700;
            color: #f5b342;
            background: #0a0a14;
            padding: 0 10px;
            border-radius: 12px;
            border: 1px solid #26263a;
            white-space: nowrap;
            min-width: 48px;
            text-align: center;
        }
        .pedal-track .pedal-percent .pct {
            font-size: 11px;
            color: #6a6a88;
        }

        /* ─── GEAR & SPEED ─── */
        .info-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 12px;
            min-width: 140px;
        }
        .info-row {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            background: #0e0e18;
            padding: 10px 18px;
            border-radius: 16px;
            border: 1px solid #26263a;
        }
        .info-row .info-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #6a6a88;
        }
        .info-row .info-value {
            font-size: 26px;
            font-weight: 700;
            color: #eee;
            letter-spacing: 1px;
        }
        .info-row .info-value .unit {
            font-size: 14px;
            font-weight: 400;
            color: #6a6a88;
            margin-left: 4px;
        }
        .info-row .info-value.gear-val {
            color: #f5b342;
            font-size: 30px;
        }

        /* ─── START BUTTON ─── */
        .start-btn {
            background: #1a2a1a;
            border: 2px solid #2a5a2a;
            color: #6a9a6a;
            padding: 8px 24px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: all 0.25s;
            box-shadow: 0 0 20px rgba(0, 60, 0, 0.15);
            margin-top: 4px;
            align-self: flex-start;
        }
        .start-btn:hover {
            background: #1f3a1f;
            border-color: #3a7a3a;
            color: #8aba8a;
            box-shadow: 0 0 30px rgba(0, 80, 0, 0.25);
        }
        .start-btn.active {
            background: #2a1a1a;
            border-color: #7a3a3a;
            color: #ba6a6a;
            box-shadow: 0 0 30px rgba(80, 0, 0, 0.25);
        }
        .start-btn.active:hover {
            background: #3a1f1f;
            border-color: #9a4a4a;
            color: #da8a8a;
        }

        /* ─── RESPONSIVE ─── */
        @media (max-width: 780px) {
            .dashboard {
                padding: 20px;
            }
            .gauges {
                flex-wrap: wrap;
            }
            .tacho-wrap {
                flex: 1 1 100%;
            }
            .tacho-canvas-wrap {
                max-width: 160px;
            }
            .gauge {
                flex: 1 1 40%;
            }
            .pedal-area {
                flex-direction: column;
                align-items: center;
            }
            .pedal-container {
                flex: 0 0 auto;
            }
            .info-panel {
                width: 100%;
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
            }
            .info-row {
                flex: 1 1 40%;
                min-width: 120px;
            }
            .header h1 {
                font-size: 15px;
            }
            .header .badge {
                font-size: 11px;
                padding: 4px 12px;
            }
        }
        @media (max-width: 480px) {
            .dashboard {
                padding: 12px;
                border-radius: 24px;
            }
            .gauge .value {
                font-size: 20px;
            }
            .tacho-center .rpm-val {
                font-size: 20px;
            }
            .info-row .info-value {
                font-size: 20px;
            }
            .info-row .info-value.gear-val {
                font-size: 24px;
            }
            .pedal-track {
                height: 200px;
                width: 50px;
            }
            .pedal-container {
                flex: 0 0 80px;
            }
        }

        /* scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0a0f;
        }
        ::-webkit-scrollbar-thumb {
            background: #2a2a3e;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="dashboard">

        <!-- HEADER -->
        <div class="header">
            <h1>⚡ RAM <span>3500</span></h1>
            <div class="badge">6.7L Cummins <i>Turbo Diesel</i> · 6‑spd Auto</div>
        </div>

        <!-- GAUGES -->
        <div class="gauges">
            <div class="gauge">
                <div class="label">Speed</div>
                <div class="value" id="speedDisplay">0 <span class="unit">mph</span></div>
            </div>
            <div class="tacho-wrap">
                <div class="label">Tachometer</div>
                <div class="tacho-canvas-wrap">
                    <canvas id="tachoCanvas" width="400" height="400"></canvas>
                    <div class="tacho-center">
                        <div class="rpm-val" id="rpmCenter">0</div>
                        <div class="rpm-label">RPM</div>
                    </div>
                </div>
            </div>
            <div class="gauge">
                <div class="label">Gear</div>
                <div class="value highlight" id="gearDisplay">N</div>
            </div>
            <div class="gauge">
                <div class="label">Throttle</div>
                <div class="value" id="throttleDisplay">0 <span class="unit">%</span></div>
            </div>
        </div>

        <!-- PEDAL + INFO -->
        <div class="pedal-area">
            <div class="pedal-container">
                <div class="pedal-label">Gas Pedal</div>
                <div class="pedal-track" id="pedalTrack">
                    <div class="pedal-percent" id="pedalPercent">0<span class="pct">%</span></div>
                    <div class="pedal-fill" id="pedalFill"></div>
                    <div class="pedal-grip" id="pedalGrip"></div>
                </div>
            </div>

            <div class="info-panel">
                <div class="info-row">
                    <span class="info-label">Engine</span>
                    <button class="start-btn" id="startBtn">⏻ Start</button>
                </div>
                <div class="info-row">
                    <span class="info-label">RPM</span>
                    <span class="info-value" id="rpmDisplay">0 <span class="unit">rpm</span></span>
                </div>
                <div class="info-row">
                    <span class="info-label">Gear</span>
                    <span class="info-value gear-val" id="gearDisplay2">N</span>
                </div>
            </div>
        </div>

    </div>

    <script>
        // ═══════════════════════════════════════════════════════════════════
        //  RAM 3500  6.7L Cummins Turbo Diesel  —  Sound Engine
        // ═══════════════════════════════════════════════════════════════════

        (function() {
            'use strict';

            // ─── DOM refs ──────────────────────────────────────────────────
            const pedalTrack = document.getElementById('pedalTrack');
            const pedalFill = document.getElementById('pedalFill');
            const pedalPercent = document.getElementById('pedalPercent');
            const pedalGrip = document.getElementById('pedalGrip');

            const rpmDisplay = document.getElementById('rpmDisplay');
            const rpmCenter = document.getElementById('rpmCenter');
            const speedDisplay = document.getElementById('speedDisplay');
            const gearDisplay = document.getElementById('gearDisplay');
            const gearDisplay2 = document.getElementById('gearDisplay2');
            const throttleDisplay = document.getElementById('throttleDisplay');
            const startBtn = document.getElementById('startBtn');
            const tachoCanvas = document.getElementById('tachoCanvas');
            const ctx = tachoCanvas.getContext('2d');

            // ─── Audio context ────────────────────────────────────────────
            let audioCtx = null;
            let isRunning = false;
            let isEngineOn = false;

            // ─── Engine state ─────────────────────────────────────────────
            const state = {
                pedal: 0, // 0 … 1
                rpm: 650, // current RPM
                targetRpm: 650,
                gear: 1, // 1 … 6
                speed: 0, // mph
                gearRatios: [3.23, 1.83, 1.41, 1.00, 0.81, 0.61],
                finalDrive: 3.42,
                tireDiameter: 33, // inches
                redline: 3200,
                idle: 650,
                maxSpeed: 120,
                shiftUpRpm: 2600,
                shiftDownRpm: 1300,
                rpmSmoothing: 0.12,
            };

            // ─── Audio nodes ──────────────────────────────────────────────
            let engineOscs = [];
            let engineGains = [];
            let engineFilter = null;
            let engineFilterGain = null;
            let noiseNode = null;
            let noiseFilter = null;
            let noiseGain = null;
            let turboOsc = null;
            let turboGain = null;
            let subOsc = null;
            let subGain = null;
            let masterGain = null;
            let compressor = null;
            let analyser = null;
            let isAudioInitialized = false;

            // ─── Animation loop ───────────────────────────────────────────
            let animId = null;
            let lastTime = 0;

            // ─── Tacho drawing ────────────────────────────────────────────
            function drawTacho(rpm) {
                const w = tachoCanvas.width;
                const h = tachoCanvas.height;
                const cx = w / 2,
                    cy = h / 2;
                const r = w / 2 - 18;

                ctx.clearRect(0, 0, w, h);

                // background
                const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
                grad.addColorStop(0, '#12121e');
                grad.addColorStop(1, '#07070e');
                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.fill();
                ctx.strokeStyle = '#26263a';
                ctx.lineWidth = 2;
                ctx.stroke();

                // arc ticks
                const startAngle = -Math.PI * 0.75;
                const endAngle = Math.PI * 0.75;
                const maxRpm = 3500;

                for (let i = 0; i <= 28; i++) {
                    const frac = i / 28;
                    const angle = startAngle + frac * (endAngle - startAngle);
                    const rpmVal = frac * maxRpm;
                    const isMain = i % 4 === 0;
                    const len = isMain ? 12 : 6;
                    const inner = r - (isMain ? 28 : 18);
                    const outer = r - (isMain ? 16 : 12);
                    const x1 = cx + Math.cos(angle) * inner;
                    const y1 = cy + Math.sin(angle) * inner;
                    const x2 = cx + Math.cos(angle) * outer;
                    const y2 = cy + Math.sin(angle) * outer;
                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.strokeStyle = isMain ? '#4a4a6a' : '#2a2a42';
                    ctx.lineWidth = isMain ? 2.5 : 1.5;
                    ctx.stroke();

                    if (isMain && i > 0 && i < 28) {
                        const label = (rpmVal / 1000).toFixed(1) + 'k';
                        const lr = r - 38;
                        const lx = cx + Math.cos(angle) * lr;
                        const ly = cy + Math.sin(angle) * lr;
                        ctx.fillStyle = '#5a5a7a';
                        ctx.font = '10px "Segoe UI", sans-serif';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(label, lx, ly);
                    }
                }

                // needle
                const rpmFrac = Math.min(rpm / maxRpm, 1);
                const needleAngle = startAngle + rpmFrac * (endAngle - startAngle);
                const needleLen = r - 22;
                const nx = cx + Math.cos(needleAngle) * needleLen;
                const ny = cy + Math.sin(needleAngle) * needleLen;

                // shadow
                ctx.shadowColor = 'rgba(245, 179, 66, 0.3)';
                ctx.shadowBlur = 18;
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(nx, ny);
                ctx.strokeStyle = '#f5b342';
                ctx.lineWidth = 4;
                ctx.stroke();
                ctx.shadowBlur = 0;

                // center dot
                ctx.beginPath();
                ctx.arc(cx, cy, 8, 0, Math.PI * 2);
                ctx.fillStyle = '#f5b342';
                ctx.fill();
                ctx.shadowBlur = 0;

                // red zone
                const redStart = 0.8;
                const redEnd = 1.0;
                for (let i = 0; i < 30; i++) {
                    const frac = redStart + (i / 30) * (redEnd - redStart);
                    const angle = startAngle + frac * (endAngle - startAngle);
                    const inner = r - 8;
                    const outer = r - 2;
                    const x1 = cx + Math.cos(angle) * inner;
                    const y1 = cy + Math.sin(angle) * inner;
                    const x2 = cx + Math.cos(angle) * outer;
                    const y2 = cy + Math.sin(angle) * outer;
                    const alpha = 0.3 + 0.7 * (i / 30);
                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.strokeStyle = `rgba(200, 40, 40, ${alpha})`;
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
            }

            // ─── Init audio ──────────────────────────────────────────────
            function initAudio() {
                if (isAudioInitialized) return;
                try {
                    audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                    if (audioCtx.state === 'suspended') {
                        audioCtx.resume();
                    }
                    isAudioInitialized = true;
                    createAudioGraph();
                } catch (e) {
                    console.warn('Web Audio not supported:', e);
                }
            }

            function createAudioGraph() {
                if (!audioCtx) return;

                // Master gain & compressor
                masterGain = audioCtx.createGain();
                masterGain.gain.value = 0.0;

                compressor = audioCtx.createDynamicsCompressor();
                compressor.threshold.value = -16;
                compressor.knee.value = 6;
                compressor.ratio.value = 3.2;
                compressor.attack.value = 0.005;
                compressor.release.value = 0.12;

                masterGain.connect(compressor);
                compressor.connect(audioCtx.destination);

                // ── Main engine oscillators (3 sawtooth, detuned) ──
                engineOscs = [];
                engineGains = [];
                const freqs = [0.995, 1.000, 1.005];
                for (let i = 0; i < 3; i++) {
                    const osc = audioCtx.createOscillator();
                    osc.type = 'sawtooth';
                    osc.frequency.value = 35 * freqs[i]; // ~650 RPM idle

                    const gain = audioCtx.createGain();
                    gain.gain.value = 0.12;

                    osc.connect(gain);
                    engineOscs.push(osc);
                    engineGains.push(gain);
                }

                // ── Filter (lowpass, opens with RPM) ──
                engineFilter = audioCtx.createBiquadFilter();
                engineFilter.type = 'lowpass';
                engineFilter.frequency.value = 600;
                engineFilter.Q.value = 1.4;

                engineFilterGain = audioCtx.createGain();
                engineFilterGain.gain.value = 0.6;

                for (const g of engineGains) {
                    g.connect(engineFilter);
                }
                engineFilter.connect(engineFilterGain);
                engineFilterGain.connect(masterGain);

                // ── Sub oscillator (square, one octave down) ──
                subOsc = audioCtx.createOscillator();
                subOsc.type = 'square';
                subOsc.frequency.value = 17.5;

                subGain = audioCtx.createGain();
                subGain.gain.value = 0.08;

                subOsc.connect(subGain);
                subGain.connect(masterGain);

                // ── Diesel clatter (noise + bandpass) ──
                const bufferSize = audioCtx.sampleRate * 0.1;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                noiseNode = audioCtx.createBufferSource();
                noiseNode.buffer = buffer;
                noiseNode.loop = true;

                noiseFilter = audioCtx.createBiquadFilter();
                noiseFilter.type = 'bandpass';
                noiseFilter.frequency.value = 2800;
                noiseFilter.Q.value = 1.8;

                noiseGain = audioCtx.createGain();
                noiseGain.gain.value = 0.035;

                noiseNode.connect(noiseFilter);
                noiseFilter.connect(noiseGain);
                noiseGain.connect(masterGain);

                // ── Turbo whistle (sine) ──
                turboOsc = audioCtx.createOscillator();
                turboOsc.type = 'sine';
                turboOsc.frequency.value = 1800;

                turboGain = audioCtx.createGain();
                turboGain.gain.value = 0.012;

                turboOsc.connect(turboGain);
                turboGain.connect(masterGain);

                // ── Start oscillators ──
                for (const osc of engineOscs) osc.start();
                subOsc.start();
                noiseNode.start();
                turboOsc.start();

                // mute initially
                masterGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.01);
            }

            // ─── Update audio parameters ──────────────────────────────────
            function updateAudio(rpm, pedal, gear, speed) {
                if (!audioCtx || !isEngineOn || !masterGain) return;

                const now = audioCtx.currentTime;
                const rpmNorm = (rpm - 650) / (3200 - 650); // 0 … 1
                const clamped = Math.max(0, Math.min(1, rpmNorm));

                // 1. Engine frequency: 6‑cyl 4‑stroke firing frequency
                const baseFreq = (rpm / 60) * 3;
                for (let i = 0; i < engineOscs.length; i++) {
                    const detune = [0.995, 1.000, 1.005][i];
                    engineOscs[i].frequency.setTargetAtTime(baseFreq * detune, now, 0.04);
                }

                // 2. Sub oscillator
                subOsc.frequency.setTargetAtTime(baseFreq * 0.5, now, 0.04);

                // 3. Filter cutoff: opens with RPM
                const cutoff = 300 + clamped * 3800;
                engineFilter.frequency.setTargetAtTime(cutoff, now, 0.04);
                engineFilter.Q.setTargetAtTime(1.0 + clamped * 1.2, now, 0.04);

                // 4. Gain: volume follows RPM + pedal
                const pedalFactor = 0.3 + pedal * 0.7;
                const rpmFactor = 0.25 + clamped * 0.75;
                const baseGain = 0.12 * pedalFactor * (0.4 + 0.6 * rpmFactor);
                const masterVol = isEngineOn ? Math.min(0.55, baseGain * 1.5) : 0;

                // smooth gain changes
                masterGain.gain.setTargetAtTime(masterVol, now, 0.06);

                // 5. Turbo whistle
                const turboFreq = 1200 + clamped * 4800 + pedal * 800;
                turboOsc.frequency.setTargetAtTime(turboFreq, now, 0.05);
                const turboVol = 0.005 + clamped * 0.035 + pedal * 0.015;
                turboGain.gain.setTargetAtTime(Math.min(0.06, turboVol), now, 0.05);

                // 6. Diesel clatter: more at higher RPM
                const clatterVol = 0.01 + clamped * 0.06;
                noiseGain.gain.setTargetAtTime(Math.min(0.07, clatterVol), now, 0.05);
                noiseFilter.frequency.setTargetAtTime(2000 + clamped * 3000, now, 0.05);

                // 7. Sub gain
                subGain.gain.setTargetAtTime(0.03 + clamped * 0.09, now, 0.04);
            }

            // ─── Shifting logic ──────────────────────────────────────────
            function updateGear(rpm, speed, pedal) {
                const ratios = state.gearRatios;
                let currentGear = state.gear;

                // Only shift if engine is on and pedal > 2%
                if (!isEngineOn || pedal < 0.02) {
                    // at idle, stay in gear or go to 1st
                    if (speed < 1) currentGear = 1;
                    return currentGear;
                }

                // Upshift logic
                if (rpm > state.shiftUpRpm && currentGear < 6) {
                    const nextGear = currentGear + 1;
                    // check if we have enough speed for next gear
                    const speedInNext = (rpm / 60 * 3.14 * state.tireDiameter * 0.0254 * 60) /
                        (ratios[nextGear - 1] * state.finalDrive) * 0.621371;
                    if (speedInNext > speed * 0.85) {
                        currentGear = nextGear;
                    }
                }

                // Downshift logic
                if (rpm < state.shiftDownRpm && currentGear > 1) {
                    const prevGear = currentGear - 1;
                    const speedInPrev = (rpm / 60 * 3.14 * state.tireDiameter * 0.0254 * 60) /
                        (ratios[prevGear - 1] * state.finalDrive) * 0.621371;
                    if (speedInPrev > speed * 0.7 || rpm < 900) {
                        currentGear = prevGear;
                    }
                }

                // Don't let it go below 1
                if (currentGear < 1) currentGear = 1;
                if (currentGear > 6) currentGear = 6;

                return currentGear;
            }

            // ─── Calculate RPM from speed & gear ──────────────────────────
            function calcRpmFromSpeed(speed, gear) {
                const ratio = state.gearRatios[gear - 1];
                const rpm = (speed * ratio * state.finalDrive * 63360) /
                    (Math.PI * state.tireDiameter * 60);
                return rpm;
            }

            // ─── Calculate speed from RPM & gear ──────────────────────────
            function calcSpeedFromRpm(rpm, gear) {
                const ratio = state.gearRatios[gear - 1];
                const speed = (rpm * Math.PI * state.tireDiameter * 60) /
                    (ratio * state.finalDrive * 63360);
                return speed;
            }

            // ─── Main update loop ─────────────────────────────────────────
            function update(delta) {
                if (!isEngineOn) {
                    // engine off: rpm decays to 0
                    state.rpm *= 0.98;
                    if (state.rpm < 5) state.rpm = 0;
                    state.speed *= 0.99;
                    if (state.speed < 0.1) state.speed = 0;
                    updateDisplay(0, 0, 'N', 0);
                    drawTacho(0);
                    return;
                }

                const pedal = state.pedal;
                const currentGear = state.gear;
                const idle = state.idle;
                const redline = state.redline;

                // Target RPM based on pedal + gear
                let targetRpm;
                if (pedal < 0.02) {
                    targetRpm = idle + 20; // idle
                } else {
                    // RPM based on pedal position, but limited by gear & speed
                    const maxRpmForGear = redline;
                    targetRpm = idle + pedal * (maxRpmForGear - idle);
                }

                // Smooth RPM
                state.rpm += (targetRpm - state.rpm) * state.rpmSmoothing;

                // Clamp
                if (state.rpm < 0) state.rpm = 0;
                if (state.rpm > redline * 1.02) state.rpm = redline * 1.02;

                // Calculate speed from RPM and gear
                let speed = 0;
                if (state.rpm > 100) {
                    speed = calcSpeedFromRpm(state.rpm, currentGear);
                } else {
                    speed = 0;
                }

                // Clamp speed
                if (speed < 0) speed = 0;
                if (speed > state.maxSpeed) speed = state.maxSpeed;

                state.speed = speed;

                // Update gear based on RPM, speed, pedal
                const newGear = updateGear(state.rpm, speed, pedal);
                if (newGear !== state.gear) {
                    state.gear = newGear;
                    // re-calc speed with new gear
                    if (state.rpm > 100) {
                        speed = calcSpeedFromRpm(state.rpm, state.gear);
                        if (speed > state.maxSpeed) speed = state.maxSpeed;
                        state.speed = speed;
                    }
                }

                // Update audio
                updateAudio(state.rpm, pedal, state.gear, speed);

                // Update display
                const gearStr = state.gear.toString();
                updateDisplay(state.rpm, speed, gearStr, pedal);

                // Draw tacho
                drawTacho(state.rpm);
            }

            // ─── Update DOM ──────────────────────────────────────────────
            function updateDisplay(rpm, speed, gear, pedal) {
                const rpmVal = Math.round(rpm);
                const speedVal = Math.round(speed);
                const pedalPct = Math.round(pedal * 100);

                rpmDisplay.innerHTML = `${rpmVal} <span class="unit">rpm</span>`;
                rpmCenter.textContent = rpmVal;
                speedDisplay.innerHTML = `${speedVal} <span class="unit">mph</span>`;
                gearDisplay.textContent = gear;
                gearDisplay2.textContent = gear;
                throttleDisplay.innerHTML = `${pedalPct} <span class="unit">%</span>`;

                pedalPercent.innerHTML = `${pedalPct}<span class="pct">%</span>`;
                pedalFill.style.height = `${pedalPct}%`;
                pedalGrip.style.bottom = `${pedalPct}%`;
            }

            // ─── Pedal interaction ────────────────────────────────────────
            function setPedal(value) {
                const clamped = Math.max(0, Math.min(1, value));
                state.pedal = clamped;
                // If engine is off and pedal > 5%, auto-start
                if (!isEngineOn && clamped > 0.05) {
                    startEngine();
                }
                // If engine is on and pedal is near 0, let it idle
            }

            function getPedalFromEvent(e) {
                const rect = pedalTrack.getBoundingClientRect();
                const y = (e.clientY || e.touches?.[0]?.clientY || 0) - rect.top;
                const pct = 1 - Math.max(0, Math.min(1, y / rect.height));
                return pct;
            }

            // ─── Pedal events ─────────────────────────────────────────────
            let isDragging = false;

            function onPointerDown(e) {
                e.preventDefault();
                if (!isAudioInitialized) initAudio();
                isDragging = true;
                const val = getPedalFromEvent(e);
                setPedal(val);
            }

            function onPointerMove(e) {
                e.preventDefault();
                if (!isDragging) return;
                const val = getPedalFromEvent(e);
                setPedal(val);
            }

            function onPointerUp(e) {
                e.preventDefault();
                if (isDragging) {
                    isDragging = false;
                    // if pedal is very low, go to idle
                    if (state.pedal < 0.03) {
                        setPedal(0);
                    }
                }
            }

            // Mouse events
            pedalTrack.addEventListener('mousedown', onPointerDown);
            document.addEventListener('mousemove', onPointerMove);
            document.addEventListener('mouseup', onPointerUp);

            // Touch events
            pedalTrack.addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (!isAudioInitialized) initAudio();
                isDragging = true;
                const val = getPedalFromEvent(e);
                setPedal(val);
            }, { passive: false });

            document.addEventListener('touchmove', (e) => {
                if (!isDragging) return;
                e.preventDefault();
                const val = getPedalFromEvent(e);
                setPedal(val);
            }, { passive: false });

            document.addEventListener('touchend', (e) => {
                if (isDragging) {
                    isDragging = false;
                    if (state.pedal < 0.03) setPedal(0);
                }
            }, { passive: false });

            // ─── Start / Stop engine ──────────────────────────────────────
            function startEngine() {
                if (!isAudioInitialized) initAudio();
                if (!audioCtx) return;

                if (isEngineOn) {
                    // Stop
                    isEngineOn = false;
                    startBtn.textContent = '⏻ Start';
                    startBtn.classList.remove('active');
                    if (masterGain) {
                        masterGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.1);
                    }
                    return;
                }

                // Start
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                isEngineOn = true;
                startBtn.textContent = '⏻ Stop';
                startBtn.classList.add('active');
                state.rpm = state.idle;
                state.speed = 0;
                state.gear = 1;

                // Unmute audio
                if (masterGain) {
                    masterGain.gain.setTargetAtTime(0.01, audioCtx.currentTime, 0.02);
                }
            }

            startBtn.addEventListener('click', () => {
                if (!isAudioInitialized) initAudio();
                startEngine();
            });

            // ─── Animation loop ───────────────────────────────────────────
            function loop(time) {
                const delta = lastTime ? (time - lastTime) / 16 : 1;
                lastTime = time;
                update(delta);
                animId = requestAnimationFrame(loop);
            }

            // ─── Resize tacho ─────────────────────────────────────────────
            function resizeTacho() {
                const rect = tachoCanvas.parentElement.getBoundingClientRect();
                const size = Math.min(rect.width, rect.height, 220);
                tachoCanvas.style.width = size + 'px';
                tachoCanvas.style.height = size + 'px';
                drawTacho(state.rpm || 0);
            }

            window.addEventListener('resize', resizeTacho);

            // ─── Init ──────────────────────────────────────────────────────
            function init() {
                drawTacho(0);
                updateDisplay(0, 0, 'N', 0);
                resizeTacho();
                // auto-init audio on first interaction
                document.addEventListener('click', () => {
                    if (!isAudioInitialized) initAudio();
                }, { once: true });
                document.addEventListener('touchstart', () => {
                    if (!isAudioInitialized) initAudio();
                }, { once: true });

                // Start animation loop
                loop(0);
            }

            // ─── Cleanup ──────────────────────────────────────────────────
            function cleanup() {
                if (animId) cancelAnimationFrame(animId);
                if (audioCtx) {
                    try { audioCtx.close(); } catch (_) {}
                }
            }

            window.addEventListener('beforeunload', cleanup);

            // ─── Go ────────────────────────────────────────────────────────
            init();

            // Expose for debugging
            window.__ram = { state, setPedal, startEngine };

        })();
    </script>
</body>
</html>
